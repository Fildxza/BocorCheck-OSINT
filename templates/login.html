<!doctype html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t('login_title') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">{{ t('login_title') }}</h1>
                    <p class="text-muted">{{ t('login_subtitle') }}</p>

                    {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}

                    <form method="post" class="row g-3">
                        <input type="hidden" name="lang" value="{{ current_lang }}">
                        <div class="col-12">
                            <label class="form-label" for="username">{{ t('username') }}</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="password">{{ t('password') }}</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="col-12 d-grid">
                            <button type="submit" class="btn btn-primary">{{ t('login') }}</button>
                        </div>
                    </form>

                    <a href="{{ url_for('index', lang=current_lang) }}" class="btn btn-link mt-3 ps-0">{{ t('back_dashboard') }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
